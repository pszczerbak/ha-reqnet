name: Validate
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python
        run: python -m compileall -q custom_components/reqnet
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
